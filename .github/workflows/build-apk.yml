name: Quality checks and APK

on:
  push:
    branches: [arena/d9952aed-metra]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Unit tests, lint, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run JVM unit tests
        id: unit-tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-unit-tests.log

      - name: Run Android lint
        id: android-lint
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-lint.log

      - name: Assemble installable debug APK
        id: apk-build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-apk-build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            gradle-unit-tests.log
            gradle-lint.log
            gradle-apk-build.log
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Add JVM test output to the run summary
        if: always()
        run: |
          {
            echo '### JVM unit-test output (last 120 lines)'
            echo '```text'
            if [ -f gradle-unit-tests.log ]; then tail -n 120 gradle-unit-tests.log; else echo 'No test log was produced.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo '### Android lint output (last 120 lines)'
            echo '```text'
            if [ -f gradle-lint.log ]; then tail -n 120 gradle-lint.log; else echo 'No lint log was produced.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo '### APK build output (last 120 lines)'
            echo '```text'
            if [ -f gradle-apk-build.log ]; then tail -n 120 gradle-apk-build.log; else echo 'No APK build log was produced.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if unit tests, lint, or APK build failed
        if: steps.unit-tests.outcome == 'failure' || steps.android-lint.outcome == 'failure' || steps.apk-build.outcome == 'failure'
        run: |
          echo "::error::JVM unit tests: ${{ steps.unit-tests.outcome }}. Lint: ${{ steps.android-lint.outcome }}. APK build: ${{ steps.apk-build.outcome }}. APK build output: $(tail -n 60 gradle-apk-build.log | tr '\n' ' ')"
          exit 1

  instrumented:
    name: Room and Android integration tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run instrumented tests on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          avd-name: metra-api34
          script: |
            set -o pipefail
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace --console=plain 2>&1 | tee instrumented-tests.log

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            instrumented-tests.log
            app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
