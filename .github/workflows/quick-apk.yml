name: Debug APK

on:
  push:
    branches: [arena/d9952aed-metra]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee apk-build.log

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: apk-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Add build output to the run summary
        if: always()
        run: |
          {
            echo '### APK build output (last 120 lines)'
            echo '```text'
            if [ -f apk-build.log ]; then tail -n 120 apk-build.log; else echo 'No build log was produced.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if APK build failed
        if: steps.assemble.outcome == 'failure'
        run: |
          echo "::error::APK build failed. Final Gradle output: $(tail -n 60 apk-build.log | tr '\n' ' ')"
          exit 1
